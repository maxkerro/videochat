# Local development dependencies. Start with `pnpm infra:up`.
name: videochat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: videochat
      POSTGRES_PASSWORD: videochat
      POSTGRES_DB: videochat
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U videochat -d videochat']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for avatars and attachments (M1+). Console: http://localhost:9001
  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: videochat
      MINIO_ROOT_PASSWORD: videochat-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is healthy, then exits.
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 videochat videochat-secret &&
      mc mb --ignore-existing local/videochat-uploads &&
      exit 0"
    restart: 'no'

  # Catches every email the API sends (verification, password reset). Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
