# Render Blueprint for the staging environment (CHAT-002).
# Create it once in Render: New → Blueprint → pick this repo. See docs/DEPLOYMENT.md.
#
# Deploys are gated on CI: `autoDeployTrigger: checksPass` makes Render deploy a commit on `master`
# only after its GitHub checks (the CI workflow) have passed.

services:
  - type: web
    name: videochat-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - pnpm-lock.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: videochat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: videochat-redis
          property: connectionString
      - key: LOG_LEVEL
        value: info
      # The web app's public URL, e.g. https://videochat-web.onrender.com (set after first deploy).
      - key: CORS_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: videochat-web
    runtime: static
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: >-
      npx --yes pnpm@10.28.0 install --frozen-lockfile --filter @videochat/web... &&
      npx --yes pnpm@10.28.0 --filter @videochat/web... build
    staticPublishPath: ./apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - pnpm-lock.yaml
    routes:
      # Client-side routing: every path serves the SPA.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # The API's public URL, e.g. https://videochat-api.onrender.com (set after first deploy).
      - key: VITE_API_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false

  - type: keyvalue
    name: videochat-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

databases:
  - name: videochat-db
    plan: free
    region: frankfurt
    databaseName: videochat
    user: videochat
    postgresMajorVersion: '17'
