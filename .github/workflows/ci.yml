name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: videochat
          POSTGRES_PASSWORD: videochat
          POSTGRES_DB: videochat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U videochat" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://videochat:videochat@localhost:5432/videochat_test
      DATABASE_URL: postgres://videochat:videochat@localhost:5432/videochat_test
      REDIS_URL: redis://localhost:6379
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations apply cleanly from an empty database
        run: pnpm db:reset -- --empty && pnpm db:migrate
      - name: Dependency audit (fail on critical)
        run: pnpm audit --prod --audit-level critical

  docker:
    name: API Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: videochat-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The staging smoke test used to live here as a third job (needs: [check, docker]), gated to
  # push-to-master. That was a deadlock: `autoDeployTrigger: checksPass` in render.yaml makes
  # Render wait for every check on the commit to finish before it deploys master -- but that job
  # polled staging for the very deploy Render hadn't triggered yet (because it was waiting on that
  # same job). It could only ever time out, so master always showed red and someone had to click
  # "Manual Deploy" in the Render dashboard on every push.
  #
  # It now lives in its own workflow (staging-smoke.yml) with NO automatic trigger tied to a
  # commit -- not even `workflow_run`. A `workflow_run`-triggered workflow still attaches its check
  # run to the original commit, so Render still waits on it and the deadlock is unchanged, just one
  # hop later (confirmed the hard way: moving it to workflow_run alone did not fix this). See
  # staging-smoke.yml's own header comment for the full explanation and a real-world precedent.
