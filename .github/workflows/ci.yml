name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: videochat
          POSTGRES_PASSWORD: videochat
          POSTGRES_DB: videochat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U videochat" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://videochat:videochat@localhost:5432/videochat_test
      DATABASE_URL: postgres://videochat:videochat@localhost:5432/videochat_test
      REDIS_URL: redis://localhost:6379
      TURBO_TELEMETRY_DISABLED: 1
      # env.ts's schema requires this with no default (unlike the other auth/storage/mail vars,
      # which all fall back to a local dev value) -- it's normally supplied by the gitignored
      # apps/api/.env, which doesn't exist in CI, so the full-app e2e specs (auth, conversations,
      # messages, realtime) fail Nest's DI with "JWT_SECRET: Invalid input: expected string,
      # received undefined" without this. Any string >= 32 chars works; it never needs to match a
      # real deployment's secret since CI never talks to a real deployment.
      JWT_SECRET: ci-only-secret-do-not-use-in-production-32chars
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # --concurrency=1: ubuntu-latest is a 2-vCPU runner, and `turbo run test` has no dependency
      # between @videochat/api:test and @videochat/web:test, so by default it runs them at the same
      # time -- api's e2e suite (Nest bootstraps, Argon2 hashing, Postgres/Redis round trips)
      # competing with web's vitest/jsdom run for those same 2 cores. That contention was
      # reproduced locally (also on a 2-vCPU box) as the direct cause of
      # test/messages.e2e.spec.ts's "does not deliver a message to a socket connected as someone
      # outside the conversation" intermittently timing out even at its already-widened 8s wait:
      # the test is 100% reliable run alone, and only flakes as part of the full concurrent suite.
      # Serializing the two packages' test runs removes that self-inflicted contention (see also
      # apps/api/src/auth/password.ts's test-only Argon2 cost, the other half of this fix).
      - run: pnpm exec turbo run test --concurrency=1
      - run: pnpm build
      - name: Migrations apply cleanly from an empty database
        run: pnpm db:reset -- --empty && pnpm db:migrate
      - name: Dependency audit (fail on critical)
        run: pnpm audit --prod --audit-level critical

  docker:
    name: API Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: videochat-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The staging smoke test used to live here as a third job (needs: [check, docker]), gated to
  # push-to-master. That was a deadlock: `autoDeployTrigger: checksPass` in render.yaml makes
  # Render wait for every check on the commit to finish before it deploys master -- but that job
  # polled staging for the very deploy Render hadn't triggered yet (because it was waiting on that
  # same job). It could only ever time out, so master always showed red and someone had to click
  # "Manual Deploy" in the Render dashboard on every push.
  #
  # It now lives in its own workflow (staging-smoke.yml) with NO automatic trigger tied to a
  # commit -- not even `workflow_run`. A `workflow_run`-triggered workflow still attaches its check
  # run to the original commit, so Render still waits on it and the deadlock is unchanged, just one
  # hop later (confirmed the hard way: moving it to workflow_run alone did not fix this). See
  # staging-smoke.yml's own header comment for the full explanation and a real-world precedent.
